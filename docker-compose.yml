# Project name pinned to the Assignment 1 one, whatever folder this is cloned
# into, so Machine A reuses the existing ollama-models volume (the pinned
# digests in docs/model_pins.md) instead of creating an empty one.
name: ict3113-assignment1

services:
  ollama:
    image: ollama/ollama:0.5.7
    container_name: triage-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # CPU-only, as the client constraint requires. No GPU device is mapped.
      # OLLAMA_NUM_PARALLEL and OLLAMA_MAX_LOADED_MODELS are left at Ollama's
      # defaults for the baseline; record whatever values you observe in
      # `docker logs triage-ollama` in your test environment description.
      - OLLAMA_KEEP_ALIVE=30m
      # Assignment 2: parallelism pinned to the value Ollama chose automatically
      # in Assignment 1 (--parallel 4), so it cannot silently change when a
      # second model is loaded. Held constant for EVERY A2 configuration.
      # Threads (auto = 10) and num_ctx (2048, set per request) are unchanged.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
    deploy:
      resources:
        limits:
          # Pin CPU so results are comparable across runs and machines.
          # Set to match the client-representative hardware you describe.
          cpus: "${OLLAMA_CPUS:-4}"
          memory: "${OLLAMA_MEM:-8g}"

  triage:
    build: ./service
    container_name: triage-service
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      - TEAM_NUMBER=${TEAM_NUMBER:-9}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - OLLAMA_SEED=42
      - OLLAMA_TEMPERATURE=0
      - RUN_ID=${RUN_ID:-adhoc}
      - DB_PATH=/data/tickets.db
      - LOG_PATH=${LOG_PATH:-/logs/requests.jsonl}
      # Assignment 2 configuration under test (service/app/config.py)
      - TRIAGE_MODE=${TRIAGE_MODE:-single}
      - CASCADE_SMALL_MODEL=${CASCADE_SMALL_MODEL:-llama3.2:3b}
      - CASCADE_LARGE_MODEL=${CASCADE_LARGE_MODEL:-qwen2.5:7b}
      - CASCADE_MAX_CHARS=${CASCADE_MAX_CHARS:-500}
      # Assignment 2: the service waits up to 20 min per model call (A1: 300 s), so a
      # slow request is measured by JMeter's 10xS timeout rather than cut off as a
      # 502 by the service first. Same value for every configuration.
      - OLLAMA_TIMEOUT_S=${OLLAMA_TIMEOUT_S:-1200}
    volumes:
      - triage-data:/data
      # Logs land on the host so they can be committed with the .jtl files.
      - ./results/logs:/logs

volumes:
  ollama-models:
  triage-data:
